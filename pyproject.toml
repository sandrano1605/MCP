[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artel-powerplatform-mcp"
version = "0.1.0"
description = "Servidor MCP local para auditar Power BI PBIP y operar Power Platform de forma controlada."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "mcp>=1.0,<2",
]

[project.scripts]
artel-powerplatform-mcp = "artel_powerplatform_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artel_powerplatform_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
