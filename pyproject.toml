[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artel-powerplatform-mcp"
version = "0.1.8"
description = "Servidor MCP read-first para orquestar Power BI/Fabric oficial de Microsoft, PBIR/TMDL, Power Automate y evidencia ARTEL de forma controlada."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "mcp>=1.12.3,<2",
  "msal>=1.31,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
artel-powerplatform-mcp = "artel_powerplatform_mcp.app_v18:main"
artel-certify = "artel_powerplatform_mcp.cert_cli:main"
artel-runtime-certify = "artel_powerplatform_mcp.runtime_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artel_powerplatform_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
