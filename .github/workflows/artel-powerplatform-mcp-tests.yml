name: ARTEL Power Platform MCP tests

on:
  push:
    branches:
      - main
      - "feature/artel-powerplatform-mcp-*"
      - "feature/artel-mcp-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Match certified local FastMCP runtime
        if: matrix.python-version == '3.13'
        run: python -m pip install "mcp==1.13.0"

      - name: Compile package
        run: python -m compileall -q src

      - name: Import legacy composed MCP
        run: python -c "from artel_powerplatform_mcp.app import mcp; print('APP_IMPORT=PASS')"

      - name: Import V1.8 integrated MCP
        run: python -c "from artel_powerplatform_mcp.app_v18 import mcp; print('APP_V18_IMPORT=PASS')"

      - name: Run tests
        run: python -m pytest
